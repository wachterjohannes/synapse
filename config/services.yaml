parameters:
    default_notes: '%kernel.project_dir%/notes'
    default_db: '%kernel.project_dir%/var/brain.sqlite'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Brain\Vault:
        arguments:
            $root: '%env(default:default_notes:BRAIN_DIR)%'

    Symfony\AI\Store\Document\Transformer\TextSplitTransformer: ~

    App\Security\IntrospectionTokenHandler:
        arguments:
            $introspectionUrl: '%env(OAUTH_INTROSPECTION_URL)%'
            $clientId: '%env(OAUTH_RESOURCE_CLIENT_ID)%'
            $clientSecret: '%env(OAUTH_RESOURCE_CLIENT_SECRET)%'
            $audience: '%env(OAUTH_AUDIENCE)%'

    # The MCP client logs every failed request at error level and, without Monolog,
    # the default logger prints that to stderr. Federation reports a down friend
    # itself, so the console stays quiet. Critical messages (a crashing request) still show.
    logger:
        class: Symfony\Component\HttpKernel\Log\Logger
        arguments: ['critical']

    Symfony\AI\Store\Reranker\Reranker:
        arguments:
            $platform: '@ai.platform.cohere'
            $model: 'rerank-v3.5'

    Symfony\AI\Store\Reranker\RerankerInterface: '@Symfony\AI\Store\Reranker\Reranker'

    App\Brain\QueryVectorizer:
        arguments:
            $inner: '@ai.vectorizer.brain'
            $queryOptions: '%query_options%'

when@test:
    services:
        App\Tests\Support\MockResponses:
            public: true
