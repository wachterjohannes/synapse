security:
    role_hierarchy:
        ROLE_BRAIN_WRITE: [ROLE_BRAIN_READ]

    # The password of the browser UI is compared as it is, the UI is meant for your own machine.
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: plaintext

    providers:
        brain_users:
            memory: ~
        ui_users:
            memory:
                users:
                    synapse: { password: '%env(UI_PASSWORD)%', roles: [ROLE_UI] }

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        ui:
            pattern: ^/(ui/|$)
            stateless: true
            provider: ui_users
            http_basic: { realm: Synapse }
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: brain_users
            entry_point: App\Security\BearerChallenge
            access_token:
                token_handler: App\Security\IntrospectionTokenHandler
                failure_handler: App\Security\BearerChallenge
            access_denied_handler: App\Security\BearerChallenge

    access_control:
        - { path: ^/mcp, roles: ROLE_BRAIN_READ }
        - { path: ^/(ui/|$), roles: ROLE_UI }
