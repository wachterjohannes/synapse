# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # The page and the MCP endpoint answer only to these host names, see TRUSTED_HOSTS in .env.
    # A request for any other host is refused with 400 before a route sees it.
    trusted_hosts: ['%env(TRUSTED_HOSTS)%']

    # Seconds without a byte before a call gives up. An answer with tools takes 7 to 10 seconds on a good day and half a minute
    # at a busy hour. A call that hangs does not come back, so a longer wait only delays the error message.
    # The introspection call of the MCP endpoint sets a limit of its own.
    http_client:
        default_options:
            timeout: 60

    # Every question, capture, read-aloud and recording of the browser page is a paid call. This caps how fast they can come.
    rate_limiter:
        ui_paid:
            policy: sliding_window
            limit: 20
            interval: '1 minute'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # No test may reach a provider: every call of the HTTP client lands in the queue of the test.
        http_client:
            mock_response_factory: App\Tests\Support\MockResponses
