ai:
    platform:
        cohere:
            api_key: '%env(COHERE_API_KEY)%'
        huggingface:
            api_key: '%env(HUGGINGFACE_API_KEY)%'
        elevenlabs:
            api_key: '%env(ELEVENLABS_API_KEY)%'

    # The embedding model and the agent models depend on SYNAPSE_PROVIDER, see config/providers/.

    store:
        sqlite:
            brain:
                dsn: 'sqlite:%env(default:default_db:BRAIN_DB)%'

    indexer:
        brain:
            loader: 'App\Brain\NoteLoader'
            source: '%env(default:default_notes:BRAIN_DIR)%/brain'
            transformers:
                - 'Symfony\AI\Store\Document\Transformer\TextSplitTransformer'
            vectorizer: 'ai.vectorizer.brain'
            store: 'ai.store.sqlite.brain'

    retriever:
        brain:
            vectorizer: 'App\Brain\QueryVectorizer'
            store: 'ai.store.sqlite.brain'

    agent:
        capturer:
            max_tool_calls: 10
            prompt:
                file: '%kernel.project_dir%/config/ai/capturer.md'
            tools:
                - 'App\Ai\ListNotes'
                - 'App\Ai\ReadNote'
                - 'App\Ai\SaveToInbox'
                - 'App\Ai\DescribeFormat'
                - 'App\Ai\SaveToBrain'

        reader:
            max_tool_calls: 6
            prompt:
                file: '%kernel.project_dir%/config/ai/reader.md'
            tools:
                - 'App\Ai\SearchNotes'
                - 'App\Ai\ReadNote'
